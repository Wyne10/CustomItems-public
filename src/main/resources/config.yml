regenerate: true
lang: 'en.yml'
usePlayerLanguage: true
# LEGACY/ENHANCED_LEGACY/MINI_MESSAGE
serializer: MINI_MESSAGE
# OFF/FATAL/ERROR/WARN/INFO/DEBUG/TRACE/ALL
logLevel: INFO

item:
  markov:
    name: '<red>Максим Марков'
    material: STICK
    restrictions:
      cancel-drop: true
      cancel-rename: true
      cancel-craft: true
      cancel-storage: true
    activators:
      right-click:
        commands:
          - 'say По поводу моей работы, давай я начну после вайпа на хт и аг что то делать'
        is-sneaking: true

  fast-furnace:
    name: '<light_purple>Быстрая печка'
    material: FURNACE
    glow: true
    block:
      break-drop: true
      furnace-speed: 2.0

  unbreakable-anvil:
    name: "<light_purple>Нерушимая наковальня"
    material: ANVIL
    glow: true
    block:
      break-drop: true
      unbreakable-anvil: true
