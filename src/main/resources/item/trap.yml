name: '<light_purple>Трапка'
material: POPPED_CHORUS_FRUIT
restrictions:
  cancel-craft: true
cooldowns:
  player-cooldown:
    duration: 50s
    visual: true
  other-cooldown:
    duration: 50s
    visual: true
    items: ['explosion-trap']
activators:
  right-click:
    identifier: HOLD
    not-is-within-aoe:
      - 'holytrap'
      - 'trap'
      - 'air'
      - 'end'
      - 'sand'
      - 'snow'
      - 'stone'
      - 'default'
    is-custom-item-cooldowned: false
    create-trap:
      duration: 18s
      schemes:
        holytrap:
          path: 'scheme/holytrap.schem'
  player-create-trap:
    identifier: HOLD
    block-blacklist: [CHEST]
    region-whitelist: ['__global__']
    set-item-amount: -1
    cooldown: ['player-cooldown', 'other-cooldown']
    condition-cancel-event: true
    player-explosion:
      offset: 0,0,0
      power: 1
      break-blocks: false
  player-block-place:
    identifier: EMPTY
    is-within-aoe:
      - 'holytrap'
      - 'trap'
      - 'air'
      - 'end'
      - 'sand'
      - 'snow'
      - 'stone'
      - 'default'
    cancel-event: true
  player-block-break:
    identifier: EMPTY
    is-within-aoe:
      - 'holytrap'
      - 'trap'
      - 'air'
      - 'end'
      - 'sand'
      - 'snow'
      - 'stone'
      - 'default'
    cancel-event: true