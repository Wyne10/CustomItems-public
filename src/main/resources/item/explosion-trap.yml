name: '<gray>Взрывная трапка'
material: PRISMARINE_SHARD
restrictions:
  cancel-craft: true
cooldowns:
  player-cooldown:
    duration: 50s
    visual: true
  other-cooldown:
    duration: 50s
    visual: true
    items: ['trap']
activators:
  right-click:
    identifier: HOLD
    not-is-within-aoe:
      - 'holytrap'
      - 'trap'
      - 'air'
      - 'end'
      - 'sand'
      - 'snow'
      - 'stone'
      - 'default'
    is-custom-item-cooldowned: false
    create-trap:
      duration: 18s
      schemes:
        trap:
          path: 'scheme/trap.schem'
          blocks: [GRASS_BLOCK, DIRT]
          dimensions: [NORMAL]
        air:
          path: 'scheme/trapair.schem'
          blocks: [AIR]
          dimensions: [NORMAL]
        end:
          path: 'scheme/trapend.schem'
          dimensions: [THE_END]
        sand:
          path: 'scheme/trapsand.schem'
          blocks: [SAND]
          dimensions: [NORMAL]
        snow:
          path: 'scheme/trapsnow.schem'
          blocks: [SNOW_BLOCK]
          dimensions: [NORMAL]
        stone:
          path: 'scheme/trapstone.schem'
          blocks: [STONE]
          dimensions: [NORMAL]
        default:
          path: 'scheme/trapair.schem'
  player-create-trap:
    identifier: HOLD
    block-blacklist: [CHEST]
    region-whitelist: ['__global__']
    set-item-amount: -1
    cooldown: ['player-cooldown', 'other-cooldown']
    condition-cancel-event: true
    player-explosion:
      offset: 0,0,0
      power: 1
      break-blocks: false
    create-aoe:
      key: 'stun'
      radius: 15
      duration: 18s
      particle:
        particle: REDSTONE
        data: '16711684:1.0'
  player-block-place:
    identifier: EMPTY
    block-is-within-aoe:
      - 'holytrap'
      - 'trap'
      - 'air'
      - 'end'
      - 'sand'
      - 'snow'
      - 'stone'
      - 'default'
    cancel-event: true
  player-block-break:
    identifier: EMPTY
    block-is-within-aoe:
      - 'holytrap'
      - 'trap'
      - 'air'
      - 'end'
      - 'sand'
      - 'snow'
      - 'stone'
      - 'default'
    cancel-event: true
  aoe-finish:
    is-aoe-finished:
      - 'trap-pre'
      - 'end-pre'
      - 'sand-pre'
      - 'snow-pre'
      - 'stone-pre'
    force:
      offset: 0,-1,0
      velocity: 2